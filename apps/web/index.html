<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DripForge</title><style>:root{font-family:system-ui;color-scheme:dark;background:#0b1019;color:#e9f2fa}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #2c3b4d;padding:24px 5%}h1{margin:0}h1 span{color:#4bdbb4}main{max-width:1000px;margin:35px auto;padding:0 18px}h2{font-size:clamp(27px,5vw,45px);letter-spacing:-.05em}.muted{color:#9eb0c3}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{background:#131f2e;border:1px solid #2d3f55;border-radius:16px;padding:20px;margin:18px 0}input{display:block;width:100%;background:#0b1420;color:white;border:1px solid #40536a;border-radius:8px;padding:12px;margin:10px 0}button{background:#4bdbb4;color:#071913;border:0;border-radius:8px;padding:10px 14px;font-weight:700;cursor:pointer}.item{padding:14px;margin:10px 0;background:#0b1420;border-radius:10px;overflow-wrap:anywhere}small{color:#9eb0c3}a{color:#4bdbb4}pre{white-space:pre-wrap;max-height:200px;overflow:auto;font-size:12px}@media(max-width:720px){.grid{grid-template-columns:1fr}}</style></head><body><header><h1>Drip<span>Forge</span></h1></header><main><small>ISSUE AUTOMATION</small><h2>From assigned issue to draft PR.</h2><p class="muted">Connect your self-hosted backend, select an issue and launch a containerized coding agent. GitHub CI is not yet automatically repaired.</p><section class="panel"><h3>Connect backend</h3><input id="url" placeholder="https://your-backend.example.com" aria-label="Backend URL"><input id="token" type="password" placeholder="Admin token (not saved)" aria-label="Admin token"><button id="connect">Connect</button><p id="status" role="status"></p></section><div class="grid"><section class="panel"><h3>Assigned issues <button id="reload">Refresh</button></h3><div id="issues">Connect first.</div></section><section class="panel"><h3>Agent jobs <button id="jobsReload">Refresh</button></h3><div id="jobs">Connect first.</div></section></div></main><script type="module">
const $=id=>document.getElementById(id);const element=(tag,text)=>{const n=document.createElement(tag);n.textContent=text;return n};
async function api(path,body){const base=$('url').value.trim().replace(/\/$/,'');if(!/^https:\/\//.test(base)&&!/^http:\/\/localhost(:\d+)?$/.test(base))throw Error('HTTPS API required');const r=await fetch(base+path,{method:body?'POST':'GET',headers:{authorization:'Bearer '+$('token').value,...(body?{'content-type':'application/json'}:{})},body:body?JSON.stringify(body):undefined});const data=await r.json();if(!r.ok)throw Error(data.error||'HTTP '+r.status);return data}
async function issues(){try{const data=await api('/api/issues'),root=$('issues');root.replaceChildren();for(const issue of data.filter(x=>!x.pull_request)){const div=element('div','');div.className='item';div.append(element('strong',issue.title),element('p',issue.repository.full_name+' #'+issue.number));const btn=element('button','Start agent');btn.onclick=async()=>{btn.disabled=true;try{await api('/api/jobs',{repo:issue.repository.full_name,issue:issue.number});$('status').textContent='Agent started';await jobs()}catch(e){$('status').textContent=e.message}finally{btn.disabled=false}};div.append(btn);root.append(div)}if(!root.children.length)root.append(element('p','No assigned issues'))}catch(e){$('status').textContent=e.message}}
async function jobs(){try{const data=await api('/api/jobs'),root=$('jobs');root.replaceChildren();for(const job of data){const div=element('div','');div.className='item';div.append(element('strong',job.repo+' #'+job.issue),element('p',job.status));if(job.prUrl){const a=element('a','Open draft PR');a.href=job.prUrl;a.target='_blank';a.rel='noopener noreferrer';div.append(a);const ci=element('button','Check GitHub CI');ci.style.marginLeft='10px';const result=element('p','');ci.onclick=async()=>{ci.disabled=true;try{const report=await api('/api/jobs/'+job.id+'/ci');result.textContent=report.checks.map(c=>c.name+': '+(c.conclusion||c.status)).join(', ')||'No check runs reported';result.textContent+=' — Required branch protection not verified.'}catch(e){result.textContent=e.message}finally{ci.disabled=false}};div.append(ci,result)}if(job.error)div.append(element('p',job.error));const d=element('details','');d.append(element('summary','Logs'),element('pre',job.logs.join('\n')));div.append(d);root.append(div)}if(!root.children.length)root.append(element('p','No jobs yet'))}catch(e){$('status').textContent=e.message}}
$('connect').onclick=async()=>{try{const me=await api('/api/me');$('status').textContent='Connected as '+me.login;await Promise.all([issues(),jobs()])}catch(e){$('status').textContent=e.message}};$('reload').onclick=issues;$('jobsReload').onclick=jobs;
</script></body></html>
