name: Integration checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax-and-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check application syntax
        run: |
          set -eu
          find apps workers packages -type f -name '*.mjs' -print0 | xargs -0 -r -n 1 node --check
      - name: Run core tests
        run: node --test packages/core/test/*.test.mjs
      - name: API integration smoke test
        run: node --test tests/api-smoke.test.mjs
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build API container
        run: docker build -f deploy/Dockerfile.api -t dripforge-api:ci .
      - name: Build worker container
        run: docker build -f workers/runner/Dockerfile -t dripforge-runner:ci .
      - name: Validate Compose configuration
        run: |
          printf 'ADMIN_TOKEN=dummy_token_12345678901234567890\nGITHUB_TOKEN=dummy\nMODEL_API_KEY=dummy\n' > .env
          docker compose -f deploy/compose.yml config --quiet
